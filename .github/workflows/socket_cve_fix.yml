name: Socket Fix
# Socket CVE autofix for this repo's LANGUAGE ecosystems (cargo). Socket-first:
# Socket owns language packages; Renovate (renovate.json5) covers only infra
# (Actions/Docker/CircleCI/Terraform) and Trivy covers image/IaC CVEs.
#
# Split into two jobs on purpose. The rule is: the job that runs third-party code
# holds no repository credentials, and the job that holds credentials runs no
# third-party code.
#   compute-fixes -> runs `socket` from npm, which in turn downloads and executes
#                    @coana-tech/cli at runtime. Runs with `contents: read` and no
#                    token. Its sole output is a patch file.
#   open-pr       -> applies that patch and opens the PR. Runs only actions/* and
#                    git + gh, all preinstalled on the runner.
# Do not merge these jobs back together, and do not add an `npm`/`pip`/`go`
# install step to open-pr.
on:
  schedule:
    - cron: '15 2 1 * *' # Runs at 02:15 on day 1 of the month
    - cron: '15 12 * * 0' # Runs at 12:15 on Sunday
  workflow_dispatch: #Allow manual run
permissions: {}
jobs:
  compute-fixes:
    # workflow_dispatch can be triggered from ANY branch. Constrain ONLY the manual
    # path; the `schedule` triggers are left completely alone (they can only ever run
    # on the default branch anyway), so this cannot silently stop the crons.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'

      - name: Install npm socket CLI
        # Pinned on purpose, and deliberately NOT annotated for Renovate: a global
        # `npm i -g` is outside renovate.json5's npm rules, and an automated bump here
        # would walk straight back into the broken release described below. Move this
        # by hand, after re-testing.
        #
        # Held at 1.1.147, NOT `latest`. Upstream regression introduced in 1.1.151 and
        # still present in 1.1.152 (the current `latest`): dist/vendor.js was rewritten to
        # call requireHere("form-data") on the scan-upload path, but form-data is not a
        # declared dependency and is not vendored into the tarball, so it cannot resolve.
        # vendor.js is byte-identical between 1.1.151 and 1.1.152, so rolling back a
        # single version does not help. The manifest is unchanged from 1.1.147 — only the
        # bundle differs.
        #
        # Symptom: install and auth both succeed, then the run dies mid-operation with
        # "Socket API error: Unexpected Socket API error: Cannot find module 'form-data'"
        # (the SDK wraps MODULE_NOT_FOUND as an API error). `socket --version` still
        # exits 0, so a smoke test does not catch this.
        #
        # 1.1.147 is the last release that needs no form-data, and the last observed green
        # here (run 30681967984, 2026-08-01). No fixed release exists above 1.1.152. Do
        # NOT "fix" this by jumping to socket@2 — 2.x is an abandoned Oct/Nov-2025 line
        # that merely sorts higher by semver. Re-test before moving this forward.
        run: npm i -g socket@1.1.147

      - name: Generate CycloneDX SBOM (non-native ecosystems)
        # npm/yarn/pnpm + pip are parsed natively by `socket fix`;
        # rust need an SBOM.
        continue-on-error: true
        run: socket cdxgen -t rust -o socket.cdx.json --install-deps

      # `socket fix` opens PRs itself only when it decides it is in "CI mode".
      # Source (v1.1.147, dist/cli.js getFixEnv):
      #   isCi = !!(CI && SOCKET_CLI_GIT_USER_EMAIL && SOCKET_CLI_GIT_USER_NAME
      #             && SOCKET_CLI_GITHUB_TOKEN)
      #   shouldOpenPrs = fixEnv.isCi && fixEnv.repoInfo
      # Withholding SOCKET_CLI_GITHUB_TOKEN (and the git identity vars) forces LOCAL
      # mode: "fixes will be applied directly to your working directory", no branch,
      # no push, no PR, no GitHub credential of any kind on this runner.
      # Re-adding SOCKET_CLI_GITHUB_TOKEN here silently undoes the job split above.
      - name: Run Socket Fix CLI monthly for major fixes
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_KEY }}
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_KEY }}
        if: github.event.schedule == '15 2 1 * *' || github.event_name == 'workflow_dispatch'
        run: socket fix --minimum-release-age 2w --all

      - name: Run Socket Fix CLI weekly for minor fixes
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_KEY }}
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_KEY }}
        if: github.event.schedule == '15 12 * * 0'
        run: socket fix --minimum-release-age 3d --all --no-major-updates

      - name: Collect fix patch
        id: patch
        run: |
          set -euo pipefail
          # Build artefact, not a fix.
          rm -f socket.cdx.json
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'Socket Fix found nothing to change.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The patch is applied in the next job, which is the credentialed one.
          # Socket Fix updates dependency manifests; it has no reason to touch CI
          # config, so treat that as a signal something is wrong and stop here.
          if git diff --cached --name-only | grep -qE '^"?\.github/'; then
            echo "::error title=Socket Fix blocked::Patch modifies .github/ - refusing to open a PR."
            {
              echo '### Socket Fix blocked'
              echo
              echo 'The computed patch modifies files under `.github/`, which Socket Fix is never expected to touch. No PR was opened. Inspect manually.'
              echo
              git diff --cached --name-only | grep -E '^"?\.github/' | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/socket-fix.patch"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo '### Socket Fix computed a patch'
            echo
            echo '```'
            git diff --cached --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fix patch
        if: steps.patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: socket-fix-patch
          path: ${{ runner.temp }}/socket-fix.patch
          retention-days: 1
          if-no-files-found: error

  open-pr:
    needs: compute-fixes
    if: >-
      needs.compute-fixes.outputs.has_changes == 'true'
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Gate the App-token step without referencing a possibly-absent secret in an
      # `if:` (the same pattern renovate.yml already uses in this repo).
      # create-github-app-token hard-errors on an empty client-id, which would take
      # the whole CVE autofix down rather than degrading. The fix run itself stays
      # fully functional on GITHUB_TOKEN either way.
      BOT_CLIENT_ID: ${{ secrets.AUTOFIX_PR_BOT_CLIENT_ID }}

    steps:
      - name: Generate github App Token #Generate short-lived Installation Access Token
        id: generate-token
        if: ${{ env.BOT_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.AUTOFIX_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOFIX_PR_BOT_APP_PRIVATE_KEY }}
          # Narrow the installation token to what opening a PR actually needs.
          # Without these it inherits every permission the App installation holds.
          permission-contents: write
          permission-pull-requests: write

      - name: Announce degraded mode (no PR-bot App token)
        # Falling back is better than failing -- but it must never be silent, and the
        # message must not overstate what still works. Two things are lost on
        # GITHUB_TOKEN, not one:
        #   1. A PR opened with GITHUB_TOKEN does not trigger other workflows, so the
        #      fix lands without downstream CI validation or ticketing.
        #   2. If this repository has "Allow GitHub Actions to create and approve pull
        #      requests" turned off, `gh pr create` is refused outright and NO PR is
        #      opened at all. The branch is still pushed, so nothing is lost, but a
        #      human has to open it. Verified on this repo: the setting is off here
        #      (repo-level can_approve_pull_request_reviews=false overriding the org
        #      default), and PR creation fails with "GitHub Actions is not permitted
        #      to create or approve pull requests".
        if: ${{ env.BOT_CLIENT_ID == '' }}
        run: |
          msg='The PR-bot client id does not resolve in this repository, so Socket Fix is running on GITHUB_TOKEN. Fixes are still computed and the branch is still pushed, but the PR will NOT trigger downstream CI validation or ticketing -- and if this repository disallows PR creation by Actions, no PR is opened at all and the branch must be opened by hand.'
          echo "::warning title=Socket Fix degraded::${msg}"
          { echo '### Socket Fix is running in degraded mode'; echo; echo "${msg}"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Download fix patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: socket-fix-patch
          path: ${{ runner.temp }}/socket-fix

      - name: Apply patch and open pull request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
          GIT_AUTHOR_NAME: socket-fix[bot]
          GIT_AUTHOR_EMAIL: socket-fix[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: socket-fix[bot]
          GIT_COMMITTER_EMAIL: socket-fix[bot]@users.noreply.github.com
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/socket-fix/socket-fix.patch"
          test -s "$patch"

          # Defence in depth: re-run the .github/ check on the credentialed runner,
          # so a tampered artifact cannot reach `git apply` with the App token live.
          if git apply --numstat -- "$patch" | cut -f3- | grep -qE '^"?\.github/'; then
            echo "::error title=Socket Fix blocked::Patch modifies .github/ - refusing to push."
            exit 1
          fi

          branch='socket-fix/automated-dependency-fixes'
          git checkout -B "$branch"
          git apply --index -- "$patch"
          git commit -m 'fix(deps): apply Socket CVE fixes' \
            -m 'Generated by `socket fix` in an unprivileged job; patch applied here.'
          git push --force origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo 'Existing open PR updated.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The branch is already pushed at this point, so the fixes are safe whatever
          # happens next. PR creation is the one part that can be refused by policy:
          # with GITHUB_TOKEN, a repository that has "Allow GitHub Actions to create and
          # approve pull requests" turned off rejects this with "GitHub Actions is not
          # permitted to create or approve pull requests". That must not fail the run and
          # discard the work -- it must hand the branch to a human, loudly.
          if gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title 'fix(deps): apply Socket CVE fixes' \
              --body 'Automated dependency CVE fixes computed by `socket fix`. The fix run holds no repository credentials; this PR is opened from the resulting patch in a separate job.'; then
            exit 0
          fi

          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${branch}?expand=1"
          echo "::warning title=Socket Fix could not open the PR::Fixes are pushed to ${branch} but the PR must be opened by hand: ${url}"
          {
            echo '### Socket Fix pushed a branch but could not open the PR'
            echo
            echo "The fixes are safe on \`${branch}\` -- nothing was lost. Creating the pull"
            echo 'request was refused, which normally means this repository has "Allow GitHub'
            echo 'Actions to create and approve pull requests" turned off and no PR-bot App'
            echo 'token is available here.'
            echo
            echo "[Open the pull request](${url})"
          } >> "$GITHUB_STEP_SUMMARY"
