[package]
name = "mls-tls"
version.workspace = true
edition.workspace = true

[features]
# Compile-time crypto backend selection. Exactly one of `rustcrypto` / `openssl` must be enabled
# (a `compile_error!` in src/lib.rs enforces this). They are mutually exclusive:
#   * `rustcrypto` (default): pure-Rust primitives, no system dependency, portable binaries. Includes
#     the custom X-Wing suite (0x004e) used for the Python interop, and verifies X.509 chains with
#     rustls-webpki.
#   * `openssl`: primitives from the system OpenSSL library (automatic/dynamic linking). Serves the
#     standard MLS suites only — X-Wing is unavailable and requesting it errors at runtime, and
#     X.509 chains are verified with an OpenSSL `X509_STORE`. Build with
#     `--no-default-features --features openssl`.
#
# Note that cargo features are additive: `--features openssl` *without* `--no-default-features`
# also leaves `rustcrypto` on and trips the mutual-exclusion `compile_error!`.
default = ["rustcrypto"]
rustcrypto = [
    "dep:mls-rs-crypto-rustcrypto",
    "dep:ml-kem",
    "dep:sha3",
    "dep:p384",
    "dep:rand_core",
    "dep:rustls-webpki",
    "dep:webpki-roots",
]
openssl = ["dep:mls-rs-crypto-openssl", "dep:openssl"]

[dependencies]
mls-rs = { version = "0.55.2", features = ["x509"] }
mls-rs-core = "0.27.0"
rustls-pki-types = { version = "1.14.1", features = ["std"] }
hex = "0.4.3"
thiserror = "2"
mls-rs-crypto-hpke = "0.21.0"
mls-rs-crypto-traits = "0.22.0"
zeroize = "1"

# Backend + X-Wing crates, enabled by the `rustcrypto` feature. The webpki path is confined to this
# backend so a build never pulls in two independent crypto stacks; the `openssl` backend verifies
# chains with OpenSSL instead.
mls-rs-crypto-rustcrypto = { version = "0.22.0", optional = true }
ml-kem = { version = "0.3.2", optional = true }
sha3 = { version = "0.10", optional = true }
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "alloc"], optional = true }
rand_core = { version = "0.6", optional = true }
rustls-webpki = { version = "0.103.13", features = ["ring"], optional = true }
webpki-roots = { version = "1.0.8", optional = true }

# Backend crates, enabled by the `openssl` feature. `openssl` is used directly for the `X509_STORE`
# chain verification in `src/pki/openssl_backend.rs`.
mls-rs-crypto-openssl = { version = "0.21.0", optional = true }
openssl = { version = "0.10.81", optional = true }

# Produces the Ed25519 interop fixtures with rcgen, which is `rustcrypto`-only.
[[example]]
name = "generate_fixtures"
required-features = ["rustcrypto"]

# Time-to-first-byte across a sweep of injected network latencies. Custom harness: the built-in one
# has no notion of a parameter sweep, and criterion's statistics assume microbenchmarks rather than
# runs dominated by deliberate sleeps.
[[bench]]
name = "ttfb"
path = "benches/ttfb/main.rs"
harness = false

[dev-dependencies]
rcgen = "0.14"
ed25519-dalek = "2"
hex = "0.4.3"
serde_json = "1"
# Used only by the ttfb bench's OpenSSL baseline (openssl_stack.rs) to reach the raw `*mut SSL` for the
# hand-bound `SSL_key_update` (KeyUpdate is not exposed by the `openssl` crate). Version matches the one
# `openssl` 0.10 itself depends on, so the `ForeignTypeRef::as_ptr` impl lines up.
foreign-types = "0.3.1"
