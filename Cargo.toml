[package]
name = "mls-tls"
version = "0.1.0"
edition = "2024"

[dependencies]
mls-rs = { version = "0.55.2", features = ["x509"] }
mls-rs-core = "0.27.0"
mls-rs-crypto-rustcrypto = "0.22.0"
rustls-pki-types = "1.14.1"
rustls-webpki = { version = "0.103.13", features = ["ring"] }
webpki-roots = "1.0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4.3"
thiserror = "2"
mls-rs-crypto-hpke = "0.21.0"
mls-rs-crypto-traits = "0.22.0"
ml-kem = "0.3.2"
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "alloc"] }
rand_core = "0.6"
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"
ed25519-dalek = "2"
hex = "0.4.3"
serde_json = "1"
